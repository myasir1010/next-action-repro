name: repro

# Measures how often the client drops a Server Action's result, on Linux.
# Reports a rate; never fails the build, because the point is the number.
on:
  workflow_dispatch:
  push:

jobs:
  measure:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run build

      # The reproducing configuration: the render makes 20 real outbound fetches.
      - name: 'QUERIES=20 (expected to fail some runs)'
        run: |
          PORT=3100 QUERIES=20 BULK_KEYS=1200 npm start &
          until curl -sf -o /dev/null http://localhost:3100/; do sleep 1; done
          QUERIES=20 N=12 npm run harness
          kill %1

      # The control: identical build, no outbound fetches. Expected 0 failures.
      - name: 'QUERIES=0 (control, expected 0 failures)'
        run: |
          PORT=3100 QUERIES=0 BULK_KEYS=1200 npm start &
          until curl -sf -o /dev/null http://localhost:3100/; do sleep 1; done
          QUERIES=0 N=12 npm run harness
          kill %1

      - name: How to read this
        if: always()
        run: |
          echo "Each step prints:  RESULT queries=<n> failed=<f> of <n>"
          echo "The finding is that the first is non-zero and the second is zero."
